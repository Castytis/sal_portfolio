    <style>
        ::selection { background: #6899b5; color: #0c0c0c; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.4,0,0.2,1) forwards; }
        .d1 { animation-delay: 0.1s; }
        .d2 { animation-delay: 0.25s; }
        .d3 { animation-delay: 0.4s; }

        .project-card:hover .card-img { transform: scale(1.05); }
        .project-card:hover .card-overlay { opacity: 1 !important; }
        .project-card:hover .card-text { transform: translateY(0) !important; opacity: 1 !important; }

        .btn-slide { position: relative; overflow: hidden; z-index: 0; }
        .btn-slide::before {
            content: ''; position: absolute; inset: 0; background: white;
            transform: translateX(-101%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); z-index: -1;
        }
        .btn-slide:hover::before { transform: translateX(0); }
        .btn-slide:hover { color: #0c0c0c; }

    <script>
        const projects = [
            { title: 'Popping Bubbles Podcast', category: 'Content Strategy · Social Media', cover: 'https://placehold.co/1400x900/1d2d3e/6899b5?text=Popping+Bubbles+Podcast', slug: 'popping-bubbles-podcast' },
            { title: 'Student Ambassador', category: 'Content Creation · Copywriting', cover: 'https://placehold.co/1400x900/1d2d3e/6899b5?text=Student+Ambassador', slug: 'student-ambassador' },
            { title: 'Brand Communications Strategy', category: 'Brand Strategy · Copywriting', cover: 'https://placehold.co/1400x900/1d2d3e/6899b5?text=Brand+Communications+Strategy', slug: 'brand-communications-strategy' },
            { title: 'Multi-Platform Social Campaign', category: 'Social Media · Digital Marketing', cover: 'https://placehold.co/1400x900/1d2d3e/6899b5?text=Multi-Platform+Social+Campaign', slug: 'social-campaign' },
            { title: 'Digital Marketing Audit', category: 'Digital Marketing · Analytics', cover: 'https://placehold.co/1400x900/1d2d3e/6899b5?text=Digital+Marketing+Audit', slug: 'digital-marketing-audit' },
            { title: 'MA Research: Multimodal Communication', category: 'Research · Communications', cover: 'https://placehold.co/1400x900/1d2d3e/6899b5?text=MA+Research', slug: 'ma-research' },
        ];

        const grid = document.getElementById('work-grid');
        projects.forEach((p) => {
            const card = document.createElement('a');
            card.href = 'projects/' + p.slug + '.html';
            card.style.cssText = 'display:block;text-decoration:none;';
            card.className = 'project-card';
            card.innerHTML = `
                <div style="position:relative;overflow:hidden;aspect-ratio:4/3;background:#1a1a1a;">
                    <img src="${p.cover}" alt="${p.title}" class="card-img" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy">
                    <div class="card-overlay" style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:1.25rem 1.5rem;background:linear-gradient(to top,rgba(0,0,0,0.72) 0%,transparent 55%);opacity:0;transition:opacity 0.32s ease;">
                        <div class="card-text" style="transform:translateY(8px);opacity:0;transition:transform 0.32s ease,opacity 0.32s ease;">
                            <p style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px;color:#6899b5;font-family:'DM Sans',sans-serif;">${p.category}</p>
                            <p style="font-family:'Playfair Display',Georgia,serif;color:#fff;font-size:1.2rem;line-height:1.25;">${p.title}</p>
                        </div>
                    </div>
                </div>
                <div style="padding-top:1rem;padding-bottom:0.5rem;">
                    <p style="font-family:'Playfair Display',Georgia,serif;color:#fff;font-size:1.2rem;margin-bottom:4px;">${p.title}</p>
                    <p style="color:#71717a;font-size:15px;font-family:'DM Sans',sans-serif;">${p.category}</p>
                </div>`;
            grid.appendChild(card);
        });
    </script>
